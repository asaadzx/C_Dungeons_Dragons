# ---------------------------------------------------------------------------
# render.yaml
# Render Blueprint for the C1 Hub. Render reads this file to create the web
# service. Database is Neon (set DATABASE_URL manually); Render has no managed
# free database that persists, so we do not declare one here.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: c1-ras-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    # Runs before each deploy to apply any new database migrations.
    preDeployCommand: flask --app wsgi db upgrade
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      # Render generates a strong secret for session cookies.
      - key: SECRET_KEY
        generateValue: true
      # Paste your Neon connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.6"
